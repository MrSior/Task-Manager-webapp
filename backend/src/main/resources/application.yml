server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: task-manager
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmanager}
    username: ${SPRING_DATASOURCE_USERNAME:taskmanager}
    password: ${SPRING_DATASOURCE_PASSWORD:taskmanager}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # Отдельные группы: /actuator/health/liveness и /actuator/health/readiness
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}


app:
  process-type: ${APP_PROCESS_TYPE:web}
  # 0 = off; e.g. 0.3 for screencast (30% of /api/** → HTTP 500)
  demo-fail-rate: ${APP_DEMO_FAIL_RATE:0}
