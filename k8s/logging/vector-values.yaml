role: Agent
service:
  enabled: false
customConfig:
  data_dir: /vector-data-dir
  sources:
    k8s:
      type: kubernetes_logs
  transforms:
    parse:
      type: remap
      inputs: [k8s]
      source: |
        parsed, err = parse_json(.message)
        if err == null { . = merge!(., parsed) }
  sinks:
    vlogs:
      type: elasticsearch
      inputs: [parse]
      endpoints: ["http://vlogs-victoria-logs-single-server.logging.svc:9428/insert/elasticsearch/"]
      api_version: v8
      compression: gzip
      healthcheck: { enabled: false }
      query:
        _msg_field: message
        _time_field: timestamp
        _stream_fields: kubernetes.pod_namespace,kubernetes.container_name