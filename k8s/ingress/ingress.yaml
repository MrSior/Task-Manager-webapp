apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  ingressClassName: nginx
  rules:
    - host: app.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: task-manager-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-manager-frontend
                port:
                  number: 3000