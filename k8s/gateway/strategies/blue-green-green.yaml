# Blue/Green: 100% traffic → v2 (green). Instant switch / rollback = apply blue again.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-manager
  namespace: application
spec:
  parentRefs:
    - name: task-manager-gw
  hostnames:
    - app.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: task-manager-backend-v2
          port: 8080
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: task-manager-frontend
          port: 3000
