# Shadow: primary responses from v1; mirror copy of traffic to v2 (response ignored)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-manager
  namespace: application
spec:
  parentRefs:
    - name: task-manager-gw
  hostnames:
    - app.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: task-manager-backend-v2
              port: 8080
      backendRefs:
        - name: task-manager-backend-v1
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: task-manager-frontend
          port: 3000
