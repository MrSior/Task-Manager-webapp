# Canary ramp step 2: 50% v1 / 50% v2
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-manager
  namespace: application
spec:
  parentRefs:
    - name: task-manager-gw
  hostnames:
    - app.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: task-manager-backend-v1
          port: 8080
          weight: 50
        - name: task-manager-backend-v2
          port: 8080
          weight: 50
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: task-manager-frontend
          port: 3000
