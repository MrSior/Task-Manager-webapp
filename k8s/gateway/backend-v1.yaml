apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-backend-v1
  namespace: application
  labels:
    app: task-manager-backend-v1
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: task-manager-backend-v1
      version: v1
  template:
    metadata:
      labels:
        app: task-manager-backend-v1
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: backend
          image: task-manager-backend:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_PROCESS_TYPE
              value: web
            - name: APP_VERSION
              value: "v1"
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: task-manager-secret
                  key: spring-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: task-manager-secret
                  key: spring-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-manager-secret
                  key: spring-password
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager-backend-v1
  namespace: application
  labels:
    app: task-manager-backend-v1
    version: v1
spec:
  selector:
    app: task-manager-backend-v1
    version: v1
  ports:
    - name: http
      port: 8080
      targetPort: http
