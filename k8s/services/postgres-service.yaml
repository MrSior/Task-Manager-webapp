apiVersion: v1
kind: Service
metadata:
  name: task-manager-postgres
  namespace: application
  labels:
    app: task-manager-postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
    - name: metrics
      port: 9187
      targetPort: metrics
