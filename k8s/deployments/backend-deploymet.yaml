apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-manager-backend
  template:
    metadata: 
      labels:
        app: task-manager-backend
    spec:
      containers:
      - name: backend
        image: task-manager-backend:latest
        imagePullPolicy: Never
        ports:
          - name: http
            containerPort: 8080
        env:
          - name: APP_PROCESS_TYPE
            value: web
          - name: SERVER_PORT
            value: "8080"
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              secretKeyRef:
                name: task-manager-secret
                key: spring-url
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: task-manager-secret
                key: spring-username
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: task-manager-secret
                key: spring-password
        startupProbe:
          httpGet:
            path: /actuator/health
            port: http
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      

